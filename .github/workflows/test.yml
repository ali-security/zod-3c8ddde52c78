name: test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional vitest filter; empty runs the full suite"
        required: false
        default: ""

jobs:
  test-node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NO_COLOR: "1"
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ["lts/*"]
        typescript: ["5.5", "5.9.3"]
    name: Test with TypeScript ${{ matrix.typescript }} on Node ${{ matrix.node }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm add typescript@${{ matrix.typescript }} -w
      - run: pnpm build
      - name: Pack zod
        if: matrix.typescript == '5.5'
        working-directory: ./packages/zod
        run: |
          mkdir -p ../../seal-dist
          npm pack --pack-destination ../../seal-dist
      - name: Upload packed tarball
        if: matrix.typescript == '5.5'
        uses: actions/upload-artifact@v4
        with:
          name: zod-tgz
          path: seal-dist/*.tgz
          if-no-files-found: error
      - run: pnpm test ${{ inputs.test-filter }}
      - run: pnpm run --filter @zod/resolution test:all
        if: inputs.test-filter == ''
      - run: pnpm run --filter @zod/integration test:all
        if: inputs.test-filter == ''

  lint:
    if: false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["latest"]
    name: Lint on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm lint:check

  check-circular:
    if: false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    name: Check for circular dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm check:circular
